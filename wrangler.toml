name = "www"
type = "webpack"
account_id = ""
workers_dev = true
route = ""
zone_id = ""

[env.production]
name = "www-prod"
route = ""
zone_id = ""

[build]
command = "npm run build"
cwd = "./"
watch_paths = ["src/**/*.ts"]

[build.upload]
format = "modules"
main = "./.vercel/output/static/_worker.js/index.js"

[compatibility_date]
compatibility_date = "2024-01-01"

[env.production.compatibility_flags]
compatibility_flags = ["nodejs_compat"]

[compatibility_flags]
compatibility_flags = ["nodejs_compat"]
