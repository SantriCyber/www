<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7cc576;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#7cc576;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#grad)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="60" fill="#7cc576" opacity="0.2"/>
  <circle cx="450" cy="300" r="80" fill="#7cc576" opacity="0.15"/>

  <!-- Center text -->
  <text x="300" y="190" font-family="Montserrat, sans-serif" font-size="36" font-weight="bold" fill="#7cc576" text-anchor="middle">Why SantriCyber?</text>
  <text x="300" y="230" font-family="Open Sans, sans-serif" font-size="16" fill="#666" text-anchor="middle">Professional image placeholder</text>
  <text x="300" y="260" font-family="Open Sans, sans-serif" font-size="14" fill="#999" text-anchor="middle">Replace with your own image</text>

  <!-- Border -->
  <rect x="10" y="10" width="580" height="380" fill="none" stroke="#7cc576" stroke-width="2" stroke-dasharray="5,5"/>
</svg>